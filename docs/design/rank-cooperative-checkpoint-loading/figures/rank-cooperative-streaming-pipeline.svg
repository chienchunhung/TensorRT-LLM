<svg viewBox="0 0 1800 900" role="img" aria-labelledby="rank-stream-title rank-stream-desc">
    <title id="rank-stream-title">Rank-cooperative checkpoint streaming steady-state pipeline</title>
    <desc id="rank-stream-desc">On one node, a subset of rank processes cooperatively reads disjoint checkpoint extents through the Linux page cache into the inactive shared-buffer slot for batch N plus 1. At the same time, all local ranks consume batch N from the active slot, assemble atomic weight groups, and transfer completed groups to their GPUs. Producer publication and active-world completion consensus jointly gate the next slot swap.</desc>
    <style>
      svg {
        display: block;
        width: 100%;
        height: auto;
        font-family: Arial, sans-serif;
      }
      .lane-label {
        fill: #5f6368;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 1.2px;
      }
      .section-label {
        fill: #5f6368;
        font-size: 21px;
        font-weight: 500;
        letter-spacing: 0.7px;
      }
      .label {
        fill: #202124;
        font-size: 29px;
        font-weight: 500;
      }
      .body {
        fill: #202124;
        font-size: 24px;
        font-weight: 400;
      }
      .small {
        fill: #5f6368;
        font-size: 20px;
        font-weight: 400;
      }
      .micro {
        fill: #202124;
        font-size: 19px;
        font-weight: 500;
      }
      .box {
        fill: #ffffff;
        stroke: #c7cdd4;
        stroke-width: 2;
      }
