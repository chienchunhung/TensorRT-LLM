    <path d="M 1289 278 l 8 8 l 15 -18" fill="none" stroke="#1a73e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1418" y="275" text-anchor="middle" class="body">all writes visible</text>
    <text x="1418" y="305" text-anchor="middle" class="body">publish N+1</text>

    <path d="M 1155 516 H 1245" class="flow-consume"/>

    <rect x="1255" y="441" width="290" height="186" rx="20" class="consume-box"/>
    <text x="1400" y="479" text-anchor="middle" class="section-label">ALL LOCAL RANKS</text>
    <rect x="1282" y="500" width="55" height="42" rx="10" class="consumer-chip"/>
    <rect x="1345" y="500" width="55" height="42" rx="10" class="consumer-chip"/>
    <rect x="1408" y="500" width="55" height="42" rx="10" class="consumer-chip"/>
    <rect x="1471" y="500" width="47" height="42" rx="10" class="consumer-chip"/>
    <text x="1309.5" y="529" text-anchor="middle" class="micro">R0</text>
    <text x="1372.5" y="529" text-anchor="middle" class="micro">R1</text>
    <text x="1435.5" y="529" text-anchor="middle" class="micro">R2</text>
    <text x="1494.5" y="529" text-anchor="middle" class="micro">Rn</text>
    <text x="1400" y="578" text-anchor="middle" class="body">assemble owned groups</text>
    <text x="1400" y="609" text-anchor="middle" class="small">includes producer ranks</text>

    <path d="M 1550 534 H 1580" class="flow-consume"/>

    <rect x="1590" y="441" width="170" height="186" rx="20" class="consume-box"/>
    <text x="1675" y="477" text-anchor="middle" class="section-label">GROUP READY</text>
    <text x="1675" y="510" text-anchor="middle" class="body">transform</text>
    <text x="1675" y="539" text-anchor="middle" class="body">+ H2D</text>
    <rect x="1615" y="566" width="38" height="34" rx="7" class="gpu-chip"/>
    <rect x="1657" y="566" width="38" height="34" rx="7" class="gpu-chip"/>
    <rect x="1699" y="566" width="36" height="34" rx="7" class="gpu-chip"/>
    <text x="1634" y="589" text-anchor="middle" class="micro">G0</text>
    <text x="1676" y="589" text-anchor="middle" class="micro">G1</text>
    <text x="1717" y="589" text-anchor="middle" class="micro">Gn</text>
    <text x="1675" y="619" text-anchor="middle" class="small">no GPU broadcast</text>

    <rect x="1090" y="680" width="225" height="42" rx="14" class="gate-box"/>
    <text x="1202.5" y="708" text-anchor="middle" class="micro">✓ N+1 PUBLISHED</text>
    <rect x="1500" y="680" width="220" height="42" rx="14" class="gate-box"/>
    <text x="1610" y="708" text-anchor="middle" class="micro">✓ N RELEASED</text>
    <line x1="1202.5" y1="722" x2="1202.5" y2="736" class="concurrent-line"/>
    <line x1="1610" y1="722" x2="1610" y2="736" class="concurrent-line"/>

    <rect x="1000" y="736" width="730" height="112" rx="22" class="gate-box"/>
    <text x="1365" y="770" text-anchor="middle" class="section-label">NEXT-CYCLE GATE · READY ∧ RELEASED</text>
    <text x="1365" y="802" text-anchor="middle" class="body">active-world completion / error consensus</text>
    <text x="1365" y="832" text-anchor="middle" class="small">release lease · B becomes active · A becomes reusable</text>

    <path d="M 1000 792 C 818 792 786 696 862 617" class="flow-advance"/>
    <text x="853" y="765" text-anchor="middle" class="small">swap slots / advance</text>
  </svg>
