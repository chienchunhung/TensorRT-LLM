<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#17324f"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8093a5"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #132d49; }
      .muted { font-family: Arial, Helvetica, sans-serif; fill: #5c7184; }
      .orange { font-family: Arial, Helvetica, sans-serif; fill: #8b4300; }
      .white { font-family: Arial, Helvetica, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="700" fill="#ffffff"/>

  <!-- End-to-end startup ruler -->
  <line x1="58" y1="82" x2="1548" y2="82" stroke="#17324f" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  <g stroke="#17324f" stroke-width="2">
    <line x1="60" y1="74" x2="60" y2="90"/>
    <line x1="185" y1="74" x2="185" y2="90"/>
    <line x1="1395" y1="74" x2="1395" y2="90"/>
    <line x1="1545" y1="74" x2="1545" y2="90"/>
  </g>
  <text class="label" x="120" y="38" font-size="20" font-weight="700" text-anchor="middle">
    <tspan x="120">Process</tspan><tspan x="120" dy="23">launch</tspan>
  </text>
  <text class="label" x="790" y="49" font-size="25" font-weight="700" text-anchor="middle">LLM INITIALIZATION</text>
  <text class="label" x="1470" y="49" font-size="22" font-weight="700" text-anchor="middle">Serve first request</text>

  <!-- Process launch -->
  <rect x="60" y="282" width="108" height="76" rx="14" fill="#f5f8fa" stroke="#cbd8e3" stroke-width="2"/>
  <text class="label" x="114" y="311" font-size="21" font-weight="700" text-anchor="middle">
    <tspan x="114">Process</tspan><tspan x="114" dy="24">launch</tspan>
  </text>
  <line x1="168" y1="320" x2="188" y2="320" stroke="#6f8497" stroke-width="2.5" marker-end="url(#arrow-gray)"/>

  <!-- Model-engine initialization -->
  <rect x="190" y="124" width="575" height="445" rx="16" fill="#edf5fb" stroke="#b8cee1" stroke-width="2"/>
  <rect x="212" y="145" width="5" height="29" fill="#27628f"/>
  <text class="label" x="228" y="168" font-size="23" font-weight="800">MODEL-ENGINE INITIALIZATION</text>

  <rect x="216" y="190" width="523" height="52" rx="9" fill="#ffffff" stroke="#91b4d2" stroke-width="2"/>
  <text class="label" x="477.5" y="222" font-size="20" text-anchor="middle">Model construction and configuration</text>
  <line x1="477.5" y1="242" x2="477.5" y2="259" stroke="#27628f" stroke-width="2.2" marker-end="url(#arrow-navy)"/>

  <!-- Policy-neutral model weight loading component -->
  <rect x="216" y="260" width="523" height="282" rx="13" fill="#fff9ef" stroke="#dc7900" stroke-width="3"/>
  <rect x="227" y="271" width="501" height="41" rx="9" fill="#c96900"/>
  <text class="white" x="477.5" y="298" font-size="20" font-weight="800" text-anchor="middle">MODEL WEIGHT LOADING</text>

  <text class="orange" x="477.5" y="332" font-size="14" font-weight="800" text-anchor="middle">CONCEPTUAL SUBPHASES · MAY INTERLEAVE BY MODEL</text>
  <rect x="232" y="347" width="112" height="92" rx="9" fill="#fff1d9" stroke="#e09a44" stroke-width="2"/>
  <text class="orange" x="288" y="378" font-size="16" font-weight="700" text-anchor="middle">
    <tspan x="288">Checkpoint</tspan><tspan x="288" dy="20">discovery</tspan><tspan x="288" dy="20">and read</tspan>
  </text>
  <rect x="363" y="347" width="112" height="92" rx="9" fill="#fff1d9" stroke="#e09a44" stroke-width="2"/>
  <text class="orange" x="419" y="388" font-size="16" font-weight="700" text-anchor="middle">
    <tspan x="419">Tensor map</tspan><tspan x="419" dy="20">and shard</tspan>
  </text>
  <rect x="494" y="347" width="112" height="92" rx="9" fill="#fff1d9" stroke="#e09a44" stroke-width="2"/>
  <text class="orange" x="550" y="378" font-size="16" font-weight="700" text-anchor="middle">
    <tspan x="550">Transform</tspan><tspan x="550" dy="20">quantize</tspan><tspan x="550" dy="20">and fuse</tspan>
  </text>
  <rect x="625" y="347" width="98" height="92" rx="9" fill="#fff1d9" stroke="#e09a44" stroke-width="2"/>
  <text class="orange" x="674" y="368" font-size="15" font-weight="700" text-anchor="middle">
    <tspan x="674">Materialize</tspan><tspan x="674" dy="19">H2D</tspan><tspan x="674" dy="19">and finalize</tspan>
  </text>

  <text class="muted" x="477.5" y="484" font-size="16" text-anchor="middle">
    <tspan x="477.5">Exact substeps and boundaries vary by model, backend,</tspan>
    <tspan x="477.5" dy="20">quantization flow, and checkpoint format.</tspan>
  </text>

  <!-- Remaining LLM initialization: explicit runtime dependency path -->
  <line x1="765" y1="320" x2="790" y2="320" stroke="#6f8497" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <rect x="792" y="124" width="585" height="445" rx="16" fill="#f7f9fb" stroke="#ccd9e4" stroke-width="2"/>
  <rect x="814" y="145" width="5" height="29" fill="#64798c"/>
  <text class="muted" x="830" y="168" font-size="23" font-weight="800">RUNTIME PREPARATION</text>
  <text class="muted" x="1350" y="168" font-size="15" font-weight="700" text-anchor="end">CURRENT PYTORCH ORDER</text>

  <rect x="818" y="190" width="533" height="52" rx="9" fill="#edf4fb" stroke="#2b66a0" stroke-width="2"/>
  <text class="label" x="1084.5" y="222" font-size="19" font-weight="700" text-anchor="middle">KV-cache and resource initialization</text>
  <line x1="1084.5" y1="242" x2="1084.5" y2="258" stroke="#8093a5" stroke-width="2.2" marker-end="url(#arrow-gray)"/>

  <rect x="818" y="260" width="533" height="198" rx="12" fill="#ffffff" stroke="#aebfcd" stroke-width="2"/>
  <text class="muted" x="1084.5" y="286" font-size="16" font-weight="800" text-anchor="middle">ORDERED WARMUP AND CAPTURE PIPELINE</text>

  <rect x="835" y="307" width="112" height="104" rx="9" fill="#eef9f8" stroke="#138982" stroke-width="2"/>
  <circle cx="850" cy="323" r="10" fill="#138982"/>
  <text class="white" x="850" y="328" font-size="13" font-weight="800" text-anchor="middle">1</text>
  <text class="label" x="891" y="350" font-size="15" font-weight="700" text-anchor="middle">
    <tspan x="891">Execution-path</tspan><tspan x="891" dy="19">warmup</tspan><tspan x="891" dy="18" font-size="10.5" font-weight="600" fill="#5c7184">optional compile / JIT</tspan>
  </text>
  <line x1="947" y1="359" x2="962" y2="359" stroke="#8093a5" stroke-width="2.2" marker-end="url(#arrow-gray)"/>

  <rect x="966" y="307" width="112" height="104" rx="9" fill="#fff6e8" stroke="#d87400" stroke-width="2"/>
  <circle cx="981" cy="323" r="10" fill="#d87400"/>
  <text class="white" x="981" y="328" font-size="13" font-weight="800" text-anchor="middle">2</text>
  <text class="label" x="1022" y="353" font-size="16" font-weight="700" text-anchor="middle">
    <tspan x="1022">Autotune</tspan><tspan x="1022" dy="20">tactics</tspan>
  </text>
  <line x1="1078" y1="359" x2="1093" y2="359" stroke="#8093a5" stroke-width="2.2" marker-end="url(#arrow-gray)"/>

  <rect x="1097" y="307" width="112" height="104" rx="9" fill="#edf4fb" stroke="#2b66a0" stroke-width="2"/>
  <circle cx="1112" cy="323" r="10" fill="#2b66a0"/>
  <text class="white" x="1112" y="328" font-size="13" font-weight="800" text-anchor="middle">3</text>
  <text class="label" x="1153" y="353" font-size="16" font-weight="700" text-anchor="middle">
    <tspan x="1153">CUDA graph</tspan><tspan x="1153" dy="20">capture</tspan>
  </text>
  <line x1="1209" y1="359" x2="1224" y2="359" stroke="#8093a5" stroke-width="2.2" marker-end="url(#arrow-gray)"/>

  <rect x="1228" y="307" width="106" height="104" rx="9" fill="#eef9f8" stroke="#138982" stroke-width="2"/>
  <circle cx="1243" cy="323" r="10" fill="#138982"/>
  <text class="white" x="1243" y="328" font-size="13" font-weight="800" text-anchor="middle">4</text>
  <text class="label" x="1281" y="353" font-size="15" font-weight="700" text-anchor="middle">
    <tspan x="1281">General</tspan><tspan x="1281" dy="19">memory-pool</tspan><tspan x="1281" dy="19">warmup</tspan>
  </text>

  <line x1="1084.5" y1="458" x2="1084.5" y2="474" stroke="#8093a5" stroke-width="2.2" marker-end="url(#arrow-gray)"/>
  <rect x="818" y="476" width="533" height="58" rx="9" fill="#eef9f8" stroke="#138982" stroke-width="2"/>
  <text class="label" x="1084.5" y="502" font-size="18" font-weight="700" text-anchor="middle">
    <tspan x="1084.5">Worker / event-loop start</tspan><tspan x="1084.5" dy="21">and proxy READY</tspan>
  </text>

  <!-- Serving milestones -->
  <line x1="1377" y1="320" x2="1410" y2="320" stroke="#17324f" stroke-width="2.8" marker-end="url(#arrow-navy)"/>
  <rect x="1414" y="181" width="132" height="314" rx="16" fill="#f7f9fb" stroke="#ccd9e4" stroke-width="2"/>
  <circle cx="1480" cy="238" r="15" fill="#ffffff" stroke="#2b66a0" stroke-width="4"/>
  <text class="label" x="1480" y="276" font-size="17" font-weight="700" text-anchor="middle">
    <tspan x="1480">Request</tspan><tspan x="1480" dy="20">admitted</tspan>
  </text>
  <line x1="1480" y1="290" x2="1480" y2="325" stroke="#8093a5" stroke-width="2.2" marker-end="url(#arrow-gray)"/>
  <circle cx="1480" cy="345" r="15" fill="#ffffff" stroke="#138982" stroke-width="4"/>
  <text class="label" x="1480" y="383" font-size="17" font-weight="700" text-anchor="middle">
    <tspan x="1480">First</tspan><tspan x="1480" dy="20">inference</tspan>
  </text>
  <line x1="1480" y1="397" x2="1480" y2="429" stroke="#8093a5" stroke-width="2.2" marker-end="url(#arrow-gray)"/>
  <circle cx="1480" cy="450" r="18" fill="#c96900" stroke="#8b4300" stroke-width="2"/>
  <text class="orange" x="1480" y="486" font-size="18" font-weight="800" text-anchor="middle">FIRST TOKEN</text>

  <!-- Legend and scope caveat -->
  <rect x="58" y="596" width="1484" height="76" rx="12" fill="#f7f9fb" stroke="#d2dce5"/>
  <rect x="82" y="614" width="20" height="20" rx="3" fill="#fff9ef" stroke="#dc7900" stroke-width="3"/>
  <text class="muted" x="114" y="630" font-size="17"><tspan font-weight="700">Highlighted component:</tspan> model weight loading within LLM initialization</text>
  <line x1="693" y1="624" x2="730" y2="624" stroke="#8093a5" stroke-width="2.2" marker-end="url(#arrow-gray)"/>
  <text class="muted" x="744" y="630" font-size="17"><tspan font-weight="700">Arrow:</tspan> required current-path ordering, not elapsed-time scale</text>
  <circle cx="90" cy="652" r="6" fill="#64798c"/>
  <text class="muted" x="114" y="658" font-size="16">Runtime preparation remains inside LLM initialization; configuration may skip steps, and other backends may use a different sequence.</text>
</svg>
